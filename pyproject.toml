[project]
name = "recon"
version = "0.1.0"
description = "Recon: Reconstruction-Guided Reasoning Synthesis for User Modeling"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "litellm>=1.81.9",
    "numpy>=1.26",
    "pydantic>=2.0",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=3.0",
    "tqdm>=4.67.3",
    "transformers>=4.56,<5",
]

[project.optional-dependencies]
# Recon-GRPO training
training = [
    "accelerate>=1.12.0",
    "datasets>=2.20.0",
    "peft>=0.18.1",
    "trl>=1.1.0",
    "trl[vllm]",
    "wandb>=0.24.2",
]
# Local model serving
serve = [
    "vllm>=0.15.1; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "ruff>=0.12.7",
]
